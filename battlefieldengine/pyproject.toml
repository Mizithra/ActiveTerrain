[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "battlefieldengine"
version = "0.1.0"
description = "MQTT-based battlefield simulator"
requires-python = ">=3.9"
dependencies = [
    "paho-mqtt",
]

[tool.setuptools.packages.find]
where = ["."]