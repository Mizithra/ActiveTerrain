[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "battlefieldengine"
version = "0.1.0"
description = "MQTT-based battlefield simulator"
requires-python = ">=3.9"
dependencies = [
    "jsonschema==4.26.0",
    "paho-mqtt==2.1.0",
    "Pillow==12.3.0",
    "python-dotenv==1.2.3",
    "textual==8.2.8",
]

[tool.setuptools.packages.find]
where = ["."]